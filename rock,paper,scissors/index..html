<!DOCTYPE html>
<html>
<head>
    <title>Rock, Paper, Scissors!!</title>
    <link rel="stylesheet" href="rps.css">
</head>
    
<body>
    <div>
        <h1>Rock, Paper, Scissors!!</h1>
        <h2>To play ...  click on a choice</h2>
    </div>

    <ul>
        <li>Your Pick:<span id="you">Make A Choice!</span></li>
        <li>Computer Pick:<span id="computer">What will it pick?</span></li>
        <li>The Outcome:<span id="result">Is lady luck on your side?</span></li>
        <li>Total Wins:<span id="win">0</span></li>
        <li>Total Losses:<span id="loss">0</span></li>
        <li>Ties:<span id="tie">0</span></li>
    </ul>

    <div id="buttons">
        <p id="rock">Rock</p>
        <p id="paper">Paper</p>
        <p id="scissors">Scissors</p>
    </div>
<script type="text/javascript" src="rps.js"></script>  
</body>
</html>
